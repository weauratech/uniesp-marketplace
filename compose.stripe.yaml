services:
  uniesp-marketplace:
    environment:
      PAYMENT_MODE: test
      PAYMENT_PROVIDER: stripe
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
    secrets:
      - stripe_secret_key
      - stripe_webhook_secret
secrets:
  stripe_secret_key:
    file: ./data/secrets/stripe-secret-key
  stripe_webhook_secret:
    file: ./data/secrets/stripe-webhook-secret
