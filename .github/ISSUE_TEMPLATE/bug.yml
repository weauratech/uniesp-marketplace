name: Relatar falha
description: Descrever um problema reproduzível com dados sintéticos.
title: '[Bug] '
labels: []
body:
  - type: markdown
    attributes:
      value: 'Use apenas dados sintéticos. Remova cookies, tokens, senhas e dados pessoais de logs e imagens. Vulnerabilidades devem ser relatadas privadamente conforme SECURITY.md.'
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento esperado e observado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Informe versão/commit, navegador e ambiente local/sandbox.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências sanitizadas
