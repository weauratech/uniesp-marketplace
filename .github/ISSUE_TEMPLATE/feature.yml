name: Propor melhoria
description: Descrever um caso de uso e critérios de aceite.
title: '[Melhoria] '
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema e público afetado
    validations:
      required: true
  - type: textarea
